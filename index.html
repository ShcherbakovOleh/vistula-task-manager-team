<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple Task Manager for the Vistula Team Project.">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Vistula Team Project</p>
        <h1>Task Manager</h1>
        <p class="student-line">Student ID: <strong id="student-id">67674</strong></p>
      </div>
      <a class="contribution-link" id="contribution-link" href="contribution.html">Team contribution <span aria-hidden="true">↗</span></a>
    </header>

    <section class="panel form-panel" aria-labelledby="form-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Stay organised</p>
          <h2 id="form-heading">Add a task</h2>
        </div>
      </div>
      <form id="task-form">
        <label for="task-title">Task title <span aria-hidden="true">*</span></label>
        <input id="task-title" name="title" type="text" placeholder="e.g. Practise Git commands" maxlength="200" required>
        <label for="task-description">Description</label>
        <textarea id="task-description" name="description" rows="3" placeholder="Add a few details (optional)"></textarea>
        <div class="form-actions">
          <button id="task-submit" class="button primary" type="submit">Add task</button>
          <button id="cancel-edit" class="button secondary" type="button" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="tasks-section" aria-labelledby="tasks-heading">
      <div class="tasks-heading">
        <div>
          <p class="eyebrow">Your workspace</p>
          <h2 id="tasks-heading">Your tasks</h2>
        </div>
        <button id="refresh-tasks" class="button secondary" type="button">Refresh</button>
      </div>
      <p id="status-message" class="status-message" role="status" aria-live="polite">Loading tasks…</p>
      <div id="task-list" class="task-list"></div>
    </section>
    <footer>Tasks are saved online and remain available after refreshing this page.</footer>
  </main>
</body>
</html>
